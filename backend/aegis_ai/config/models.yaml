# Model registry — maps logical model names to Ollama model identifiers.
# Edit model names to match your local Ollama installation (`ollama list`).

models:

  qwen-general:
    provider: ollama
    model: "qwen3.5:4b"
    capabilities:
      - general
      - reasoning
      - summarization
      - document_analysis
      - artifact_generation
    context_length: 32768
    priority: 10
    # The local 4B build can spend the entire bounded response budget in
    # hidden thinking and return empty visible content. Keep final answers
    # reliable for the interactive task pipeline.
    supports_thinking: false

  qwen-vision:
    provider: ollama
    model: "qwen3-vl:4b"
    capabilities:
      - vision
      - multimodal
      - image_analysis
      - document_analysis
    context_length: 32768
    priority: 10
    # Keep vision responses visible and bounded on the local 4B model.
    supports_thinking: false

  qwen-coder:
    provider: ollama
    model: "qwen2.5-coder:7b"
    capabilities:
      - coding
      - debugging
      - code_execution
    context_length: 32768
    priority: 10
    supports_thinking: false

  llama-small:
    provider: ollama
    model: "llama3.2:1b"
    capabilities:
      - general
      - lightweight
    context_length: 8192
    priority: 1
    is_fallback: true
    supports_thinking: false
